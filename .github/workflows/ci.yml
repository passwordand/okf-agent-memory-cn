name: CI

on:
  push:
    branches: [ main, develop, 'codex/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  check:
    name: Windows build and compatibility
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve LF for Go formatting checks
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check format and static analysis
        run: |
          $files = git ls-files '*.go'
          $unformatted = gofmt -l $files
          if ($unformatted) { throw "Go formatting required: $unformatted" }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and test Windows
        run: |
          go build -ldflags "-X main.Version=ci" -o bin/okf.exe ./cmd/okf
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # 两项测试需要文件符号链接权限；junction 边界由真实 MCP 集成测试覆盖。
          go test ./... -skip '^(TestCLIAgentsLint|TestCreateAndCheckToolSymlinks)$'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test examples/dual-mcp/mem-mcp.test.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test upgrade through real MCP processes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.4.3-cn.1 --repo $env:GITHUB_REPOSITORY --pattern okf-windows-amd64.exe --dir dist/legacy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/test-upgrade-isolation.cjs bin/okf.exe dist/legacy/okf-windows-amd64.exe dist/upgrade-compatibility.json ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate knowledge
        run: |
          foreach ($bundle in @('knowledge', 'examples/software', 'examples/coaching', 'examples/books')) {
            $result = ./bin/okf.exe validate $bundle --strict --drift --json | ConvertFrom-Json
            if ($LASTEXITCODE -or $result.errors.Count -or $result.warnings.Count) { throw "Validation failed: $bundle" }
          }
